<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Your DP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Event Title Here</h1>
<p>Upload your photo to create your DP</p>
<input type="file" id="upload" accept="image/*">
<canvas id="canvas" width="1080" height="1080"></canvas>
<p>Zoom</p>
<input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
<p>Drag the photo to reposition it</p>
<button id="download">Download DP</button>
<button id="share">Share</button>
<script src="script.js"></script>
</body>
  </html>
